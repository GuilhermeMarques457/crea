<h2 mat-dialog-title class="flex items-center gap-2">
  <mat-icon class="text-blue-600">draw</mat-icon>
  Assinar Termo
</h2>

<mat-dialog-content>
  <p class="text-sm text-slate-500 mb-3">
    Desenhe sua assinatura no campo abaixo usando o mouse ou toque na tela.
  </p>
  <canvas #canvas class="signature-canvas w-full" [class.active]="!isEmpty()"></canvas>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-button color="warn" (click)="limpar()" [disabled]="isEmpty()">
    <mat-icon>refresh</mat-icon> Limpar
  </button>
  <button mat-flat-button color="primary" (click)="confirmar()" [disabled]="isEmpty()">
    <mat-icon>check</mat-icon> Confirmar Assinatura
  </button>
</mat-dialog-actions>
