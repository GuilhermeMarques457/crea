<div class="flex items-center gap-3 mb-6">
  @if (icon()) {
    <mat-icon class="text-blue-700 text-3xl w-8 h-8">{{ icon() }}</mat-icon>
  }
  <div>
    <h1 class="text-2xl font-semibold text-slate-800 m-0">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="text-slate-500 text-sm m-0 mt-0.5">{{ subtitle() }}</p>
    }
  </div>
  <div class="ml-auto">
    <ng-content></ng-content>
  </div>
</div>
