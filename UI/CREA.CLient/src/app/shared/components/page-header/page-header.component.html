<div class="mb-6 flex min-w-0 flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
  <div class="flex min-w-0 flex-1 items-start gap-3">
    @if (icon()) {
      <mat-icon class="h-8 w-8 shrink-0 text-3xl text-blue-700">{{ icon() }}</mat-icon>
    }
    <div class="min-w-0">
      <h1 class="m-0 text-xl font-semibold text-slate-800 sm:text-2xl">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="m-0 mt-0.5 text-sm text-slate-500">{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div
    class="flex w-full min-w-0 shrink-0 flex-col gap-2 sm:w-auto sm:flex-row sm:flex-wrap sm:items-center sm:justify-end"
  >
    <ng-content></ng-content>
  </div>
</div>
