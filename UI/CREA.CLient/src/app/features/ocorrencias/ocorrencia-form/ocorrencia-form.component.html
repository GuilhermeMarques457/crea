<div class="page-container max-w-2xl">
  <app-page-header
    [title]="isEdit() ? 'Editar Ocorrência' : 'Nova Ocorrência'"
    subtitle="Registre ocorrências da obra"
    icon="report_problem"
  >
    <button mat-button (click)="voltar()"><mat-icon>arrow_back</mat-icon> Voltar</button>
  </app-page-header>

  <mat-card>
    <mat-card-content class="p-4 md:p-6">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <mat-form-field appearance="outline">
            <mat-label>Data da Ocorrência</mat-label>
            <input matInput [matDatepicker]="dp" formControlName="dataOcorrencia" />
            <mat-datepicker-toggle matSuffix [for]="dp" />
            <mat-datepicker #dp />
            <mat-error>Data é obrigatória</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Tipo</mat-label>
            <mat-select formControlName="tipo">
              @for (t of tipoOptions; track t.value) {
                <mat-option [value]="t.value">{{ t.label }}</mat-option>
              }
            </mat-select>
            <mat-error>Tipo é obrigatório</mat-error>
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Título</mat-label>
          <input matInput formControlName="titulo" />
          <mat-error>Título é obrigatório</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Descrição</mat-label>
          <textarea
            matInput
            formControlName="descricao"
            rows="4"
            placeholder="Descreva a ocorrência em detalhes..."
          ></textarea>
          <mat-error>Descrição é obrigatória</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Providências Tomadas</mat-label>
          <textarea matInput formControlName="providencias" rows="3"></textarea>
        </mat-form-field>
        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end sm:gap-3">
          <button mat-button type="button" (click)="voltar()">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            @if (saving()) {
              <mat-spinner diameter="18" class="inline-block mr-2"></mat-spinner>
            }
            {{ saving() ? 'Salvando...' : isEdit() ? 'Salvar' : 'Registrar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
