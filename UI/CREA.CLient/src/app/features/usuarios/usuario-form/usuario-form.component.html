<div class="page-container max-w-2xl">
  <app-page-header [title]="isEdit() ? 'Editar Usuário' : 'Novo Usuário'" icon="person">
    <button mat-button (click)="voltar()"><mat-icon>arrow_back</mat-icon> Voltar</button>
  </app-page-header>

  <mat-card>
    <mat-card-content class="p-6">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <mat-form-field appearance="outline" class="md:col-span-2">
            <mat-label>Nome Completo</mat-label>
            <input matInput formControlName="nome" />
            <mat-error>Nome é obrigatório</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>E-mail</mat-label>
            <input matInput formControlName="email" type="email" />
            <mat-error>E-mail inválido</mat-error>
          </mat-form-field>

          @if (!isEdit()) {
            <mat-form-field appearance="outline">
              <mat-label>Senha</mat-label>
              <input matInput formControlName="senha" type="password" />
              <mat-error>Senha deve ter ao menos 6 caracteres</mat-error>
            </mat-form-field>
          }

          <mat-form-field appearance="outline">
            <mat-label>Tipo de Usuário</mat-label>
            <mat-select formControlName="tipoUsuario">
              @for (t of tiposUsuario; track t.value) {
                <mat-option [value]="t.value">{{ t.label }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          @if (isEdit()) {
            <div class="flex items-center">
              <mat-slide-toggle formControlName="ativo" color="primary">Ativo</mat-slide-toggle>
            </div>
          }
        </div>

        <div class="flex justify-end gap-3">
          <button mat-button type="button" (click)="voltar()">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            @if (saving()) {
              <mat-spinner diameter="18" class="inline-block mr-2"></mat-spinner>
            }
            {{ saving() ? 'Salvando...' : isEdit() ? 'Salvar' : 'Cadastrar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
